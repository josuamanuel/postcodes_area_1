const bandColors = {"0":"#22c55e","1":"#f59e0b","2":"#ef4444"};
const feeMap = { 0: 0, 1: 30, 2: 50 };

const legend = L.control({ position: 'bottomright' });
legend.onAdd = function() {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = '<strong>Travel Fee Bands</strong><br>' +
    '<span style="background:#22c55e"></span> Band 0 — £0<br>' +
    '<span style="background:#f59e0b"></span> Band 1 — £30<br>' +
    '<span style="background:#ef4444"></span> Band 2 — £50';
  return div;
};
legend.addTo(map);

const info = L.control({ position: 'topleft' });
info.onAdd = function() {
  const div = L.DomUtil.create('div', 'info');
  div.id = 'info';
  div.innerHTML = 'Hover over an area';
  return div;
};
info.addTo(map);

const layerMap = {};

const features = L.geoJSON(data, {
  pointToLayer: function(feature, latlng) {
    return L.circleMarker(latlng, {
      radius: 14,
      fillColor: feature.properties.color,
      color: '#333',
      weight: 1,
      opacity: 0.8,
      fillOpacity: 0.7,
    });
  },
  onEachFeature: function(feature, layer) {
    const p = feature.properties;
    layerMap[p.outcode] = layer;
    layer.bindTooltip('<strong>' + p.outcode + '</strong><br>Band ' + p.band + ' — £' + p.fee + '<br>' + p.duration + ' min', {
      sticky: true,
    });
    layer.on('mouseover', function() {
      document.getElementById('info').innerHTML =
        '<strong>' + p.outcode + '</strong> — Band ' + p.band + ' — £' + p.fee + ' — ' + p.duration + ' min';
    });
  },
}).addTo(map);

const bounds = features.getBounds();
if (bounds.isValid()) {
  map.fitBounds(bounds.pad(0.1));
  map.setMaxBounds(bounds.pad(0.2));
}

const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');

searchInput.addEventListener('input', function() {
  var val = searchInput.value.trim().toUpperCase();
  if (!val) {
    searchResults.innerHTML = '';
    document.getElementById('info').innerHTML = 'Hover over an area';
    Object.values(layerMap).forEach(function(l) { l.closeTooltip(); });
    return;
  }
  var match = data.features.find(function(f) { return f.properties.outcode === val; });
  if (match) {
    var p = match.properties;
    searchResults.innerHTML = '<span class="match"><strong>' + p.outcode + '</strong> — Band ' + p.band + ' — £' + p.fee + ' — ' + p.duration + ' min</span>';
    var layer = layerMap[p.outcode];
    if (layer) {
      document.getElementById('info').innerHTML =
        '<strong>' + p.outcode + '</strong> — Band ' + p.band + ' — £' + p.fee + ' — ' + p.duration + ' min';
      Object.values(layerMap).forEach(function(l) { l.closeTooltip(); });
      layer.openTooltip();
      map.setView(layer.getLatLng(), map.getZoom());
    }
  } else {
    searchResults.innerHTML = '<span class="no-match">No match found</span>';
    document.getElementById('info').innerHTML = 'Hover over an area';
    Object.values(layerMap).forEach(function(l) { l.closeTooltip(); });
  }
});
</script>
